<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="anchor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0d1317" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <rect width="128" height="128" rx="28" fill="#0d1317" />
  <circle cx="64" cy="64" r="54" fill="url(#glow)" />

  <!-- Breathing ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#anchor-grad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Anchor Symbol -->
  <!-- Top ring -->
  <circle cx="64" cy="34" r="9" fill="none" stroke="url(#anchor-grad)" stroke-width="5" />
  <circle cx="64" cy="34" r="3" fill="#38bdf8" />

  <!-- Central shaft -->
  <line x1="64" y1="43" x2="64" y2="92" stroke="url(#anchor-grad)" stroke-width="5" stroke-linecap="round" />

  <!-- Crossbar -->
  <line x1="46" y1="52" x2="82" y2="52" stroke="url(#anchor-grad)" stroke-width="5" stroke-linecap="round" />

  <!-- Curved arms / flukes -->
  <path d="M 36 78 C 36 98, 92 98, 92 78" fill="none" stroke="url(#anchor-grad)" stroke-width="5" stroke-linecap="round" />

  <!-- Fluke tips -->
  <path d="M 30 76 L 36 82 L 42 76" fill="none" stroke="url(#anchor-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 86 76 L 92 82 L 98 76" fill="none" stroke="url(#anchor-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
